# ===== ENVIRONMENT =====
num_seconds: 5000
sumocfg_path: "../simulations_files/2way-single-intersection/single-intersection.sumocfg"
tls_id: "t"
cycles_per_action: 2
warmup_cycles: 1
delta: 5.0
min_green: 10.0
max_green: 120.0
min_cycle: 40.0
max_cycle: 300.0
scale_min: 0.5
scale_max: 1.5
reward_scale: 10

# ===== RL HYPERPARAMETERS =====
gamma: 0.9
episodes: 1500
alpha_theta: 1.0e-2           # paso de la política (theta)
alpha_w: 5.0e-2               # paso de la línea base v̂ (w)
baseline_time_feature: true   # agrega el tiempo restante a las features de v̂
 
# ===== TRAINING =====
master_seed: 1
num_trainings: 5
