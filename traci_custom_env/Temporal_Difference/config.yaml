# ===== ENVIRONMENT =====
num_seconds: 1000
delta_time: 20

# ===== RL HYPERPARAMETERS =====
gamma: 0.9
episodes: 850
epsilon_update_interval: 4
alpha: 0.1

# ===== EPSILON =====
epsilon:
  start: 0.1
  min: 0.01
  decay: 0.9

# ===== TRAINING =====
master_seed: 34
num_trainings: 25

# ===== TEMPORSAL DIFFERENCE =====
method: "E_SARSA"
