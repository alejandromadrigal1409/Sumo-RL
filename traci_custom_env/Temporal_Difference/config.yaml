# ===== ENVIRONMENT =====
num_seconds: 2000
delta_time: 20
sumof_cfg: "2way-single-intersection/single-intersection.sumocfg"

# ===== RL HYPERPARAMETERS =====
gamma: 0.9
episodes: 100
epsilon_update_interval: 4
alpha: 0.1

# ===== EPSILON =====
epsilon:
  start: 0.1
  min: 0.01
  decay: 0.95

# ===== TRAINING =====
master_seed: 34
num_trainings: 1

# ===== TEMPORSAL DIFFERENCE =====
method: "QL"
