# ===== ENVIRONMENT =====
num_seconds: 2000
delta_time: 30

# ===== RL HYPERPARAMETERS =====
gamma: 0.9
episodes: 500
epsilon_update_interval: 4
alpha: 0.1

# ===== EPSILON =====
epsilon:
  start: 0.1
  min: 0.01
  decay: 0.99

# ===== TRAINING =====
master_seed: 34
num_trainings: 30

# ===== TEMPORSAL DIFFERENCE =====
method: "E_SARSA"
